name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: analyze · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pubspec 제약: sdk >=3.3.0, flutter >=3.19.0. 감사(2026-08-31)에서 검증된 3.38.5 stable로 고정.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Versions
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # pub.dev 게시 가능 상태를 매 PR에서 확인한다 (경고는 허용, 오류만 실패).
      - name: Publish dry-run
        run: flutter pub publish --dry-run
