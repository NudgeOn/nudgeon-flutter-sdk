name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: analyze · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pubspec 제약: sdk >=3.3.0, flutter >=3.19.0. 감사(2026-08-31)에서 검증된 3.38.5 stable로 고정.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Versions
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # pub.dev 게시 가능 상태를 매 PR에서 확인한다 (경고는 허용, 오류만 실패).
      - name: Publish dry-run
        run: flutter pub publish --dry-run

  swift-contract:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  native-consumer:
    name: Fresh ${{ matrix.platform }} consumer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          cache: true
      - run: python3 tests/consumer/prepare.py "$RUNNER_TEMP/consumer"
      - if: matrix.platform == 'android'
        working-directory: ${{ runner.temp }}/consumer
        run: flutter build apk --debug --target-platform android-arm64
      - if: matrix.platform == 'ios'
        working-directory: ${{ runner.temp }}/consumer/ios
        run: |
          pod install
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Debug -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
